[workspace]
resolver = "3"
members = [
    "crates/nexus-core",
    "crates/fake-claude",
    "crates/nexus-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Makogai/nexus"

[workspace.dependencies]
nexus-core = { path = "crates/nexus-core" }
dunce = "1"
dirs = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
which = "8"

[workspace.lints.rust]
# deny (not forbid): one audited exception exists — `webview_guard::harden` (env removal before any thread starts).
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
