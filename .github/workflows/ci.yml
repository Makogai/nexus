name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # start a run by hand (Actions → CI → Run workflow, or `gh workflow run ci.yml`)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        # A slow mirror may finish (one was still downloading after 10 min); a silent one fails after 30 s per request.
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A hanging package mirror fails fast (timeouts, retries) instead of holding the job for hours.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (all failures in one run)
        run: cargo test --workspace --no-fail-fast

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: E2E (Windows, real app)
    # Drives the real app (embedded production frontend + CSP, real IPC and PTY) over the WebView2 DevTools
    # protocol with a fake-claude profile. See docs/TESTING.md.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build test double and CLI (desktop sessions start `nexus mcp`)
        run: cargo build -p fake-claude -p nexus-cli
      - name: Build app in production mode (embedded frontend, no test feature)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle
      - name: T18 — production build ignores WebView2 debugging overrides
        working-directory: apps/desktop
        run: node e2e/t18-check.mjs
      - name: Build app for E2E (explicit e2e-webview-debugging feature)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle --features e2e-webview-debugging
      - name: End-to-end smoke test
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/run-smoke.mjs
      - name: End-to-end task flow with a NEXUS restart
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/task-flow.mjs
      - name: End-to-end profile diagnostics and AI Kits
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/profiles-kits.mjs
      - name: End-to-end notifications and session attention
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/attention.mjs
      - name: End-to-end Constitution Manager
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/constitutions.mjs
      - name: End-to-end Context Manager
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/context.mjs
      - name: End-to-end Workflow Engine
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/workflows.mjs
      - name: End-to-end Usage dashboard
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/usage.mjs
      - name: End-to-end Sync Center
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/sync.mjs
      - name: MCP interoperability (official TypeScript SDK client)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/mcp-interop.mjs
      - name: End-to-end Portable Workspace (schema, templates, Doctor, projects, records, sync policy)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/portable.mjs
      - name: End-to-end new-computer restoration (two app instances)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/restore.mjs
      - name: End-to-end new workspace in a prepared place, project from Git
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/workspace-setup.mjs
      - name: End-to-end project workbench (knowledge editing, explorer, learning)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/workbench.mjs
      - name: Installer (debug profile, production configuration, CLI as sidecar)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npx tauri build --debug --config src-tauri/tauri.installer.conf.json
      - name: Installed-app verification (install, CLI/MCP/self-check/notifications, uninstall keeps data)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node e2e/installed.mjs
