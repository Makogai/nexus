name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: E2E (Windows, real app)
    # Drives the real app (embedded production frontend + CSP, real IPC and PTY) over the WebView2 DevTools
    # protocol with a fake-claude profile. See docs/TESTING.md.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build test double and CLI (desktop sessions start `nexus mcp`)
        run: cargo build -p fake-claude -p nexus-cli
      - name: Build app in production mode (embedded frontend, no test feature)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle
      - name: T18 — production build ignores WebView2 debugging overrides
        working-directory: apps/desktop
        run: node e2e/t18-check.mjs
      - name: Build app for E2E (explicit e2e-webview-debugging feature)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle --features e2e-webview-debugging
      - name: End-to-end smoke test
        working-directory: apps/desktop
        run: node e2e/run-smoke.mjs
      - name: End-to-end task flow with a NEXUS restart
        working-directory: apps/desktop
        run: node e2e/task-flow.mjs
      - name: End-to-end profile diagnostics and AI Kits
        working-directory: apps/desktop
        run: node e2e/profiles-kits.mjs
      - name: End-to-end notifications and session attention
        working-directory: apps/desktop
        run: node e2e/attention.mjs
      - name: End-to-end Constitution Manager
        working-directory: apps/desktop
        run: node e2e/constitutions.mjs
      - name: MCP interoperability (official TypeScript SDK client)
        working-directory: apps/desktop
        run: node e2e/mcp-interop.mjs
