name: Release (draft)

# Builds, tests and verifies NEXUS for Windows, macOS and Linux for a version tag (or on demand), then creates ONE DRAFT
# GitHub release with every installer, a combined SHA256SUMS.txt and build-provenance attestations. Nothing is
# published automatically: a person reviews the draft and publishes it. See docs/DECISIONS/0033 and 0040.
#
#   git tag v0.1.0 && git push origin v0.1.0     → builds + draft release
#   Actions → Release (draft) → Run workflow      → builds only (artifacts on the run, no release)
#
# One pipeline: the run includes every CI check (`ci`: clippy and tests on all platforms, frontend, the Windows E2E
# suites) and the draft appears only when they and the builds pass. Push the `release:` commit on main together with its
# tag (`git push --atomic origin main vX.Y.Z`); the standalone CI run skips that commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x64, NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      # Workspace tests on Windows run in the `ci` job of this run (the critical path stays the installer build).
      - name: Test double for the installed-app check
        run: cargo build -p fake-claude --locked
      - name: Release installer (CLI bundled as sidecar), signed for updates
        working-directory: apps/desktop
        env:
          # Signed updates (ADR-0044): the updater files are signed with the owner's key; NEXUS verifies them against
          # the public key in tauri.conf.json before installing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.installer.conf.json --config src-tauri/tauri.updater.conf.json
      # Code signing (decision pending, ADR-0033): sign nexus-desktop.exe, nexus.exe and the installer here, before the
      # checksums and attestations — e.g. Azure Trusted Signing or `signtool` with a certificate from repository secrets.
      - name: T18 — the release program ignores WebView2 debugging overrides
        working-directory: apps/desktop
        run: node e2e/t18-check.mjs ../../target/release/nexus-desktop.exe
      - name: Installed-app verification (install, check, uninstall)
        working-directory: apps/desktop
        shell: pwsh
        run: node e2e/installed.mjs (Get-ChildItem ../../target/release/bundle/nsis/*-setup.exe).FullName
      - name: Release checks
        working-directory: apps/desktop
        run: node scripts/release-check.mjs ../../target/release/bundle/nsis
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: Apple silicon
          - target: x86_64-apple-darwin
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      # Workspace tests on macOS (Apple silicon) run in the `ci` job of this run.
      # Not notarized yet (needs an Apple Developer ID, ADR-0033): the bundle is ad-hoc signed (`signingIdentity: "-"`),
      # so macOS asks the person to confirm the first start.
      - name: App bundle and disk image (CLI bundled as sidecar), signed for updates
        working-directory: apps/desktop
        env:
          # Signed updates (ADR-0044): the updater files are signed with the owner's key; NEXUS verifies them against
          # the public key in tauri.conf.json before installing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.installer.conf.json --config src-tauri/tauri.updater.conf.json --target ${{ matrix.target }} --bundles app,dmg
      - name: Update archive named by architecture (both builds make NEXUS.app.tar.gz)
        shell: bash
        run: |
          ver=$(node -p "require('./apps/desktop/package.json').version")
          arch=${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}
          cd target/${{ matrix.target }}/release/bundle/macos
          mv NEXUS.app.tar.gz "NEXUS_${ver}_${arch}.app.tar.gz"
          mv NEXUS.app.tar.gz.sig "NEXUS_${ver}_${arch}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux (x64, AppImage + deb)
    # The oldest supported Ubuntu LTS runner: an AppImage built against an older glibc runs on more distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Tauri, WebKitGTK)
        # A slow mirror may finish (one was still downloading after 10 min); a silent one fails after 30 s per request.
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A hanging package mirror fails fast (timeouts, retries) instead of holding the job for hours.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: AppImage and Debian package (CLI bundled as sidecar), AppImage signed for updates
        working-directory: apps/desktop
        env:
          # Signed updates (ADR-0044): the updater files are signed with the owner's key; NEXUS verifies them against
          # the public key in tauri.conf.json before installing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.installer.conf.json --config src-tauri/tauri.updater.conf.json --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  draft-release:
    name: Draft release
    needs: [ci, windows, macos, linux]
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      id-token: write # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: One flat folder of release files
        working-directory: dist
        run: |
          # The Linux artifact keeps its appimage/ and deb/ folders; a release lists files, not folders.
          find . -mindepth 2 -type f -exec mv -n -t . {} +
          find . -mindepth 1 -type d -empty -delete
          if [ -n "$(find . -mindepth 1 -type d)" ]; then echo "::error::two release files share a name"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update manifest (latest.json, ADR-0044)
        run: |
          node apps/desktop/scripts/updater-manifest.mjs dist "${{ github.ref_name }}" "${{ github.repository }}" docs/RELEASE_NOTES.md
          rm dist/*.sig
      - name: Licences and third-party notices (MIT OR Apache-2.0, ADR-0035)
        run: cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Draft release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --draft --verify-tag --title "NEXUS ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md dist/*

      # Updates (decision pending): tauri-plugin-updater needs an update-signing key (TAURI_SIGNING_PRIVATE_KEY) and a
      # latest.json per release. Not enabled; a new version is installed over the old one.
