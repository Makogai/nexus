[package]
name = "nexus-desktop"
description = "NEXUS Desktop — the Tauri shell: IPC commands and the PTY manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexus-desktop"
path = "src/main.rs"

[features]
# TEST-ONLY. Keeps WebView2 debugging overrides (DevTools protocol) for automated E2E tests (threat T18,
# ADR-0015). Never enable for builds that are distributed to users.
e2e-webview-debugging = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-core.workspace = true
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
which.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
winreg = "0.56"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
